<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendário de Vencimentos - Best Options</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="calendar-styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header calendar-header">
            <div class="header-content calendar-header-content">
                <div class="calendar-brand" aria-label="Best Options">
                    <div class="calendar-brand-title"><span aria-hidden="true">📊</span> Best Options</div>
                    <p>Monitor Profissional de Operações com Opções</p>
                </div>
                <div class="calendar-page-title">
                    <h1>📅 Calendário de Vencimentos</h1>
                    <p class="subtitle">Linha do Tempo de Operações com Opções</p>
                </div>
            </div>
            <div class="header-actions" style="flex-direction: column; align-items: flex-end; gap: 8px;">
                <!-- O badge do usuário é injetado aqui em cima pelo auth.js -->
                <div class="calendar-header-controls">
                    <label class="closed-operations-toggle" for="showClosedOperationsToggle" title="Incluir operações encerradas na linha do tempo">
                        <span class="switch-control">
                            <input type="checkbox" id="showClosedOperationsToggle" onchange="toggleClosedOperations(this.checked)">
                            <span class="switch-slider" aria-hidden="true"></span>
                        </span>
                        <span class="toggle-label">Mostrar encerradas</span>
                    </label>
                    <button class="btn btn-primary" onclick="openAddExpiryModal()">+ Adicionar Operação</button>
                    <a href="index.html" class="btn btn-secondary">← Voltar ao Dashboard</a>
                </div>
            </div>
        </header>

        <!-- Timeline -->
        <div class="timeline-wrapper">
            <div class="timeline-navigation timeline-navigation-left" aria-label="Navegação esquerda da linha do tempo">
                <button class="timeline-arrow timeline-arrow-left" id="scrollLeftBtn" onclick="scrollTimeline('left')" aria-label="Mover a linha do tempo para a esquerda" title="Mover para a esquerda">❮</button>
                <button class="timeline-arrow timeline-jump-first" id="jumpFirstOperationBtn" onclick="jumpToOperationDate('first')" aria-label="Ir para a primeira data com operação" title="Ir para a primeira data com operação">⏮</button>
            </div>
            <div class="timeline-axis-sticky">
                <div class="timeline-container timeline-axis-container">
                    <div class="timeline timeline-axis" id="timelineAxis">
                        <!-- Linha e descrições das datas serão inseridas aqui -->
                    </div>
                </div>
            </div>
            <div class="timeline-container timeline-cards-container">
                <div class="timeline timeline-cards" id="timeline">
                    <!-- Cards das operações serão inseridos aqui -->
                </div>
            </div>
            <div class="timeline-navigation timeline-navigation-right" aria-label="Navegação direita da linha do tempo">
                <button class="timeline-arrow timeline-arrow-right" id="scrollRightBtn" onclick="scrollTimeline('right')" aria-label="Mover a linha do tempo para a direita" title="Mover para a direita">❯</button>
                <button class="timeline-arrow timeline-jump-last" id="jumpLastOperationBtn" onclick="jumpToOperationDate('last')" aria-label="Ir para a última data com operação" title="Ir para a última data com operação">⏭</button>
            </div>
        </div>
    </div>

    <!-- Modal de Adição de Operação -->
    <div id="addExpiryModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Adicionar Operação</h2>
                <button class="close-btn" onclick="closeAddExpiryModal()">&times;</button>
            </div>
            <form onsubmit="addExpiryOperation(event)">
                <div class="form-group">
                    <label>Data de Vencimento *</label>
                    <input type="date" id="expiryDate" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Ativo *</label>
                        <input type="text" id="expiryAsset" placeholder="Ex: PETR4" required>
                    </div>
                    <div class="form-group">
                        <label>Strike *</label>
                        <input type="number" id="expiryStrike" placeholder="Ex: 25.00" step="0.01" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Tipo *</label>
                        <select id="expiryType" required>
                            <option value="">Selecione...</option>
                            <option value="call">Call Comprada</option>
                            <option value="put">Put Comprada</option>
                            <option value="call-sold">Call Vendida</option>
                            <option value="put-sold">Put Vendida</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Quantidade *</label>
                        <input type="number" id="expiryQuantity" placeholder="Ex: 1" step="0.01" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Preço de Entrada *</label>
                        <input type="number" id="expiryEntryPrice" placeholder="Ex: 0.50" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label>IV (%)</label>
                        <input type="number" id="expiryIV" placeholder="Ex: 25" step="0.1">
                    </div>
                </div>
                <div class="form-group">
                    <label>Observações</label>
                    <textarea id="expiryNotes" placeholder="Notas sobre a operação..." rows="2"></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeAddExpiryModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Adicionar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal de Encerramento Parcial -->
    <div id="closePartialModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Encerrar Posição</h2>
                <button class="close-btn" onclick="closeClosePartialModal()">&times;</button>
            </div>
            <form onsubmit="savePartialClose(event)">
                <input type="hidden" id="closeOperationId">
                <div class="form-group">
                    <label>Quantidade a Encerrar *</label>
                    <input type="number" id="closeQuantity" placeholder="Ex: 0.5" step="0.01" required>
                    <small id="availableQty" style="color: var(--text-secondary); margin-top: 5px;"></small>
                </div>
                <div class="form-group">
                    <label>Preço de Saída *</label>
                    <input type="number" id="closePrice" placeholder="Ex: 0.75" step="0.01" required>
                </div>
                <div class="form-group">
                    <label>Data de Encerramento</label>
                    <input type="date" id="closeDate">
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeClosePartialModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Encerrar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    
    <!-- Firebase Configuration -->
    <script src="firebase-config.js"></script>
    
    <!-- Auth Module -->
    <script src="auth.js"></script>

    <!-- Firebase Sync Module -->
    <script src="firebase-sync.js"></script>
    
    <!-- Calendar Script -->
    <script src="calendar-script.js?v=04ecd6b"></script>
</body>
</html>
